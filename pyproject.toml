[project]
name = "localrok"
version = "0.1.0"
description = "Local RAG with agent-directed search and verifiable sources"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.126.0,<2.127",
    "mcp>=2.0",          # server/mcp_server.py uses mcp.server.mcpserver.MCPServer
]

[project.scripts]
localrok = "localrok.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]
web = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "uvicorn[standard]>=0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localrok"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".", "web"]
